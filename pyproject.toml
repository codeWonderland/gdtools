[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gdtools"
dynamic = ["version"]
description = "Command-line tools for Godot projects (scene tree visualizer and more)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []
keywords = ["godot", "gamedev", "cli", "tscn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/codeWonderland/gdtools"

[project.scripts]
gdtools = "gdtools.cli:main"

[tool.setuptools]
packages = ["gdtools"]

[tool.setuptools.dynamic]
version = { attr = "gdtools.__version__" }
